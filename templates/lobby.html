<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby - Mystery Island Adventure</title>
</head>
<body>

    <h1>🏝️ Game Lobby</h1>

    <h2>Room Code: {{ room_code }}</h2>
    <h3>Players in this room:</h3>

    <ul id="players-list">
        {% for player in players %}
            <li>{{ player }}</li>
        {% endfor %}
    </ul>

<p>Game Status: <span id="game-status">{{ status }}</span></p>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
    const socket = io();
    const roomCode = {{ room_code|tojson }};

    socket.on('connect', () => {
        console.log('Connected to the game server!');
        socket.emit('join_game_room', { room_code: roomCode });
    });
    
    socket.on('room_update', (data) => {
        const playersList = document.getElementById('players-list');
        const gameStatus = document.getElementById('game-status');

        playersList.innerHTML = '';

        data.players.forEach((player) => {
            const li = document.createElement('li');
            li.textContent = player;
            playersList.appendChild(li);
        });

        gameStatus.textContent = data.status;
    });

</script>
</body>
</html>
