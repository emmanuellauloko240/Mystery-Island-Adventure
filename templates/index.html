
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystery Island Adventure</title>
</head>

<body>

    <!-- GAME HEADER -->

    <h1>🏝️ Mystery Island Adventure</h1>

    <p>Two explorers. One mysterious island. One hidden treasure.</p>

    <h2>Ready for the adventure?</h2>


    <!-- CREATE ROOM -->

    <h3>Create a Game Room</h3>

    <form action="{{ url_for('create_room') }}" method="POST">

        <input
            type="text"
            name="player_name"
            placeholder="Enter your name"
            required
        >

        <button type="submit">
            Create Room
        </button>

    </form>


    <!-- JOIN ROOM -->

    <h3>Join a Game Room</h3>

    <form action="{{ url_for('join_room') }}" method="POST">

        <input
            type="text"
            name="player_name"
            placeholder="Enter your name"
            required
        >

        <input
            type="text"
            name="room_code"
            placeholder="Enter room code"
            required
        >

        <button type="submit">
            Join Room
        </button>

    </form>

</body>

</html>
